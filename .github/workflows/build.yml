name: Build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # next.config.mjs sets typescript.ignoreBuildErrors, so `next build`
      # alone will not surface type errors. Run tsc separately for a real
      # signal, without blocking the build on it.
      - name: Typecheck
        run: npx tsc --noEmit
        continue-on-error: true

      - run: npm run build
