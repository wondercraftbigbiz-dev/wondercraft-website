<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 136" width="570" height="136">
  <!-- 2x2 icon grid: each tile 60x60, gap 4px, outer margin 4px -->
  <!-- Total grid width: 4+60+4+60+4 = 132px -->

  <!-- Top-left: Paintbrush on amber/yellow background -->
  <rect x="4" y="4" width="60" height="60" rx="11" ry="11" fill="#F5C87A"/>
  <g transform="translate(34, 34) rotate(-45)">
    <rect x="-2.5" y="-22" width="5" height="20" rx="2.5" fill="white"/>
    <rect x="-3.5" y="-2" width="7" height="5" rx="1" fill="#e8b55a"/>
    <ellipse cx="0" cy="9" rx="4.5" ry="8" fill="white"/>
  </g>

  <!-- Top-right: Handprint on coral/rose background -->
  <rect x="68" y="4" width="60" height="60" rx="11" ry="11" fill="#F08E8E"/>
  <g transform="translate(98, 34)">
    <ellipse cx="0" cy="8" rx="11" ry="9" fill="white"/>
    <rect x="-9" y="-17" width="5" height="18" rx="2.5" fill="white"/>
    <rect x="-2.5" y="-21" width="5" height="22" rx="2.5" fill="white"/>
    <rect x="4" y="-19" width="5" height="20" rx="2.5" fill="white"/>
    <rect x="9.5" y="-13" width="4.5" height="14" rx="2.5" fill="white"/>
    <rect x="-16" y="-2" width="8" height="5" rx="2.5" fill="white" transform="rotate(-28 -12 0)"/>
  </g>

  <!-- Bottom-left: Paint palette on teal background -->
  <rect x="4" y="68" width="60" height="60" rx="11" ry="11" fill="#6EC6A0"/>
  <g transform="translate(34, 98)">
    <ellipse cx="0" cy="0" rx="18" ry="16" fill="white"/>
    <circle cx="7" cy="6" r="5.5" fill="#6EC6A0"/>
    <circle cx="-9" cy="-5" r="3" fill="#F5C87A"/>
    <circle cx="0" cy="-12" r="3" fill="#F08E8E"/>
    <circle cx="9" cy="-5" r="3" fill="#C4B0E8"/>
    <circle cx="-4" cy="4" r="2.5" fill="#87CEEB"/>
  </g>

  <!-- Bottom-right: House on lavender background -->
  <rect x="68" y="68" width="60" height="60" rx="11" ry="11" fill="#C4B0E8"/>
  <g transform="translate(98, 103)">
    <polygon points="0,-22 -17,-6 17,-6" fill="white"/>
    <rect x="-12" y="-6" width="24" height="19" rx="2" fill="white"/>
    <rect x="-5" y="3" width="9" height="10" rx="2" fill="#C4B0E8"/>
  </g>

  <!-- WonderCraft text -->
  <text
    x="146"
    y="74"
    font-family="'Nunito Black', 'Nunito', 'Arial Rounded MT Bold', 'Arial Black', Arial, sans-serif"
    font-size="52"
    font-weight="900"
    fill="#2A2A2A"
    letter-spacing="-0.5"
  >WonderCraft</text>

  <!-- TOY FACTORY subtext -->
  <text
    x="152"
    y="104"
    font-family="'Nunito', 'Arial', sans-serif"
    font-size="14"
    font-weight="400"
    fill="#2A2A2A"
    letter-spacing="5.5"
  >TOY FACTORY</text>
</svg>